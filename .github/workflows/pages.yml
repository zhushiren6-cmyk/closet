name: Web app

on:
  push:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Unit tests
        run: |
          set -o pipefail
          node --test web/test/logic.test.mjs 2>&1 | tee test.log
          echo "::notice::web $(grep -E '^# (tests|pass|fail) ' test.log | tr '\n' ' ')"
      - name: Stamp cache version so phones pick up the new build
        run: sed -i "s/const CACHE = 'closet-v1'/const CACHE = 'closet-${GITHUB_SHA::8}'/" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
